name: Build and publish the map

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "demo (fake data, 1 min) or all (real OpenAlex data, ~20 min)"
        default: all
        type: choice
        options: [all, demo]
  schedule:
    - cron: "17 3 1 * *"   # rebuild with fresh data on the 1st of each month

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the map
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        run: python run.py ${{ github.event.inputs.mode || 'all' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
